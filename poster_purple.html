<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR助手 - 分享海报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F5F0EB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .poster {
            width: 600px;
            background: #FFFEF9;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 2px 40px rgba(0,0,0,0.06);
        }
        .header {
            padding: 36px 32px 14px;
            text-align: center;
        }
        .brand-tag {
            display: inline-block;
            background: #FDE6A6;
            color: #8B6F1F;
            font-size: 13px;
            font-weight: 500;
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }
        .title {
            font-size: 34px;
            font-weight: 700;
            color: #3D3A3A;
            letter-spacing: 2px;
            margin-bottom: 3px;
        }
        .subtitle {
            font-size: 13px;
            color: #AAA;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .divider {
            width: 36px;
            height: 2px;
            background: #FDE6A6;
            border-radius: 2px;
            margin: 14px auto 0;
        }
        .content {
            padding: 0 28px 28px;
            text-align: center;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 28px;
            margin-top: 16px;
        }
        .feature {
            border-radius: 16px;
            padding: 22px 18px 18px;
            text-align: center;
            cursor: default;
        }
        /* 马卡龙八色 */
        .feat-1 { background: #F4F2FF; }
        .feat-2 { background: #FFF6F0; }
        .feat-3 { background: #E8FAF5; }
        .feat-4 { background: #EEF2FF; }
        .feat-5 { background: #FFFEF0; }
        .feat-6 { background: #FDF2F8; }
        .feat-7 { background: #FEF1EF; }
        .feat-8 { background: #FFFDEA; }

        .feature svg { width: 36px; height: 36px; margin-bottom: 8px; }
        .feature-title {
            font-size: 14px;
            font-weight: 600;
            color: #4A4A4A;
            margin-bottom: 4px;
        }
        .feature-desc {
            font-size: 11px;
            color: #AAA;
            font-weight: 400;
        }
        .qr-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 18px 0;
            margin-bottom: 14px;
            border-top: 1px solid #F0ECE4;
            border-bottom: 1px solid #F0ECE4;
        }
        .qr-code {
            width: 90px;
            height: 90px;
            background: #fff;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .qr-code img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        .qr-info {
            text-align: left;
        }
        .qr-info-title {
            font-size: 15px;
            font-weight: 500;
            color: #3D3A3A;
            margin-bottom: 4px;
        }
        .qr-info-sub {
            font-size: 12px;
            color: #BBB;
            line-height: 1.6;
            white-space: nowrap;
        }
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .footer-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #FDE6A6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #8B6F1F;
        }
        .footer-text { text-align: left; }
        .footer-name {
            font-size: 14px;
            font-weight: 500;
            color: #3D3A3A;
        }
        .footer-slogan {
            font-size: 11px;
            color: #CCC;
        }
        .print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #3D3A3A;
            color: #FFFEF9;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .print-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        @media print {
            body { background: #FFFEF9; padding: 0; }
            .print-btn { display: none; }
            .poster { box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="poster" id="poster">
        <div class="header">
            <div class="brand-tag">悦汇城 · 员工服务</div>
            <div class="title">HR 助手</div>
            <div class="subtitle">操作指引汇总平台</div>
            <div class="divider"></div>
        </div>
        <div class="content">

            <div class="features">
                <!-- 1. 账号开通 - 柔紫 -->
                <div class="feature feat-1">
                    <svg viewBox="0 0 36 36" fill="none" stroke="#9B8AE0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="30" height="30" rx="5"/>
                        <circle cx="18" cy="14" r="4"/>
                        <path d="M8 26c0-3 2.5-5 5-5h10c2.5 0 5 2 5 5"/>
                    </svg>
                    <div class="feature-title">账号开通</div>
                    <div class="feature-desc">入职注册全流程</div>
                </div>
                <!-- 2. 考勤指引 - 暖杏 -->
                <div class="feature feat-2">
                    <svg viewBox="0 0 36 36" fill="none" stroke="#E8987A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="18" r="14"/>
                        <polyline points="18,9 18,18 24,22"/>
                    </svg>
                    <div class="feature-title">考勤指引</div>
                    <div class="feature-desc">打卡补卡全攻略</div>
                </div>
                <!-- 3. 请假指南 - 薄荷 -->
                <div class="feature feat-3">
                    <svg viewBox="0 0 36 36" fill="none" stroke="#6EBFA0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 5h14l6 6v18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>
                        <polyline points="22,5 22,11 28,11"/>
                        <line x1="12" y1="20" x2="24" y2="20"/>
                        <line x1="12" y1="24" x2="20" y2="24"/>
                    </svg>
                    <div class="feature-title">请假指南</div>
                    <div class="feature-desc">休假申请与审批</div>
                </div>
                <!-- 4. IT办公 - 靛蓝 -->
                <div class="feature feat-4">
                    <svg viewBox="0 0 36 36" fill="none" stroke="#7B8CE0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="30" height="20" rx="2"/>
                        <line x1="12" y1="31" x2="24" y2="31"/>
                        <line x1="18" y1="25" x2="18" y2="31"/>
                    </svg>
                    <div class="feature-title">IT办公</div>
                    <div class="feature-desc">软件网络与设备</div>
                </div>
                <!-- 5. 员工转正 - 暖金 -->
                <div class="feature feat-5">
                    <svg viewBox="0 0 36 36" fill="none" stroke="#D4A838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="12" r="7"/>
                        <path d="M7 31c0-6 5-10 11-10s11 4 11 10"/>
                        <polyline points="13,15 16,19 22,14"/>
                    </svg>
                    <div class="feature-title">员工转正</div>
                    <div class="feature-desc">试用期转正流程</div>
                </div>
                <!-- 6. 开具证明 - 柔粉 -->
                <div class="feature feat-6">
                    <svg viewBox="0 0 36 36" fill="none" stroke="#E88AB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="26" height="28" rx="3"/>
                        <rect x="11" y="7" width="14" height="2.5" rx="1" fill="#E88AB5" stroke="none"/>
                        <rect x="11" y="13" width="14" height="2.5" rx="1" fill="#E88AB5" stroke="none"/>
                        <rect x="11" y="19" width="8" height="2.5" rx="1" fill="#E88AB5" stroke="none"/>
                        <circle cx="27" cy="33" r="4.5" fill="#FDF2F8" stroke="#E88AB5"/>
                        <path d="M25 33l1.5 1.5 2.5-2.5"/>
                    </svg>
                    <div class="feature-title">开具证明</div>
                    <div class="feature-desc">在职收入证明等</div>
                </div>
                <!-- 7. 员工离职 - 珊瑚 -->
                <div class="feature feat-7">
                    <svg viewBox="0 0 36 36" fill="none" stroke="#E88A7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 31v-3a5 5 0 0 0-5-5H10a5 5 0 0 0-5 5v3"/>
                        <circle cx="14" cy="11" r="5"/>
                        <path d="M26 16l5 5m0-5l-5 5"/>
                    </svg>
                    <div class="feature-title">员工离职</div>
                    <div class="feature-desc">离职手续与交接</div>
                </div>
                <!-- 8. 更多 - 暖蜜 -->
                <div class="feature feat-8">
                    <svg viewBox="0 0 36 36" fill="none" stroke="#C9A050" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="18" r="14"/>
                        <path d="M18 12v12M12 18h12"/>
                    </svg>
                    <div class="feature-title">更多……</div>
                    <div class="feature-desc">FAQ与常见问题</div>
                </div>
            </div>

            <div class="qr-wrap">
                <div class="qr-code">
                    <img id="qrcode" src="" alt="扫码访问">
                </div>
                <div class="qr-info">
                    <div class="qr-info-title">扫一扫打开</div>
                    <div class="qr-info-sub">微信 / 浏览器 均可访问<br>随时查看 HR 操作指引</div>
                </div>
            </div>

            <div class="footer">
                <div class="footer-dot">悦</div>
                <div class="footer-text">
                    <div class="footer-name">悦汇城</div>
                    <div class="footer-slogan">让工作更简单</div>
                </div>
            </div>
        </div>
    </div>

    <button class="print-btn" onclick="savePoster()">保存图片</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const url = 'https://laohe789.github.io/hr-guide/';

        function generateQR() {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(url)}&margin=4`;
            document.getElementById('qrcode').src = qrUrl;
        }

        async function savePoster() {
            const btn = document.querySelector('.print-btn');
            btn.textContent = '生成中...';
            btn.disabled = true;
            try {
                const canvas = await html2canvas(document.getElementById('poster'), {
                    scale: 3, useCORS: true, allowTaint: true, backgroundColor: '#FFFEF9'
                });
                const link = document.createElement('a');
                link.download = 'HR助手-分享海报.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.textContent = '已保存';
                setTimeout(() => { btn.textContent = '保存图片'; btn.disabled = false; }, 2000);
            } catch (err) {
                btn.textContent = '请截图保存';
                setTimeout(() => { btn.textContent = '保存图片'; btn.disabled = false; }, 2000);
            }
        }

        window.onload = generateQR;
    </script>
</body>
</html>
